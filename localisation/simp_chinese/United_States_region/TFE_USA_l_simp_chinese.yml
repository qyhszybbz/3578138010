 USA_New_Reformer:0 "新改革者"

 USA_political_rotation_end:0 "政治轮换结束"
 USA_political_rotation_end_desc:0 "对于我们来说，联邦共和国的现状可谓百废待兴，新英格兰的烂摊子等着我们清理、费城武装叛乱的余波仍在进一步恶化，极端分子转入地下，随时准备反扑。随着国会通过最后议案，新总统的上台将带领我们走向伟大复兴与祖国统一。"
 USA_Coolidge_term:0 "柯立芝总统的任期"
 USA_Coolidge_term_desc:0 "正所谓新官上任三把火，1923年波士顿罢工事件将柯立芝推入政界的聚光灯之下，这位马萨诸塞州来的“英国佬”以繁荣和恢复经济地位的竞选口号赢得了广泛支持。"
 USA_Defend_republican_tradition:0 "坚守共和传统"
 USA_Defend_republican_tradition_desc:0 "我们将在全国所有党政机关、公共广场重新悬挂共和先贤肖像与共和理念标语，让每一个走入公共空间的公民，都能一眼望见那些为美利坚民主浴血牺牲的先贤。"
 USA_Heal_torn_society:0 "弥和撕裂的社会"
 USA_Heal_torn_society_desc:0 "巨型企业与军工复合体长期把控着我们国家的命脉，一旦战争或危机爆发，政府将会彻底沦为傀儡与牺牲品，而一个正常的民主共和国绝对不会将经济命脉交予少数人。"
 USA_National_bottleneck:0 "国家瓶颈事业"
 USA_National_bottleneck_desc:0 "鉴于联邦复杂冗余的行政体制，我们会从根部下手，彻底拆分联邦与各州的权责重叠地带：将跨州交通、全民社保这类全国性事务完全收归联邦统筹，消除推诿与重复建设。"
 USA_Purge_political_chaos:0 "整肃政坛乱象"
 USA_Purge_political_chaos_desc:0 "多党制改革遗留下来的政治权力异化和程序繁琐给极端恐怖主义留下了存活的契机，极端民族主义者、工人运动、士兵委员会和不受议会管控的联邦安全机构相互勾结。"
 USA_State_rights_return:0 "州权归位"
 USA_State_rights_return_desc:0 "要想加强政府的权威与中央调动力，一个强硬的手段是必不可少的。西部地区的爱达荷州常年遭受南方叛徒渗透和日益不绝的严重匪患，地区秩序处于崩溃边缘。"
 USA_Sign_presidential_decree:0 "签署总统令"
 USA_Sign_presidential_decree_desc:0 "柯立芝总统以恢复经济和增强军事实力为主的中央政策受到多数众议院议员的广泛支持，联邦共和国改革大方向坚决不能动摇。在落笔后，这套命令将立即生效。"
 USA_Suppress_extremism:0 "压制极端主义思潮"
 USA_Suppress_extremism_desc:0 "虽然我们的美利坚祖国被叛徒分裂，统一的趋势势在必得，但复仇主义与赤色恐怖绝不能搬上政治台面。如果让极端主义者掌握局势，我们的民主将会万劫不复。"
 USA_Relax_political_control:0 "放松政治管控"
 USA_Relax_political_control_desc:0 "我们是以自由民主而奋斗的自由共和国，是在日益敌对的局势里带来民主光辉和多元局面的掌舵人。而不是到处打压，只会让政治陷入独裁、让权力产生腐败。"
 USA_Remember_division_shame:0 "铭记分裂之耻"
 USA_Remember_division_shame_desc:0 "新世纪的国民们也许都忘了，是南方的叛徒们率先打响了分裂的第一枪，是他们将我们的合众国推向了万劫不复，他们用谎言与民族主义论调来掩饰自己的罪行。"
 USA_Domestic_trade_protection:0 "本土贸易保护"
 USA_Domestic_trade_protection_desc:0 "贸易主权就是国家命脉，欧洲强权在那场贯穿四年的世界战争中逐步恢复了元气，而对美洲贸易的增多和移民也增大了我们的经济负担，我们不能袖手旁观。"
 USA_Wall_street_fund:0 "华尔街投资基金"
 USA_Wall_street_fund_desc:0 "为了使十年前的经济危机不再重蹈覆辙，我们将在纽约证券交易所和美联储设立断路器和紧急停止程序及配套资金，用于保护国家资金流和方便政府进行调控。"
 USA_Defense_command:0 "国防军司令部"
 USA_Defense_command_desc:0 "美利坚联邦国防军是联邦共和国的重要武装力量，是美利坚抵抗外来侵略、保卫领土主权和国民安全、捍卫宪法与民主制度的中流砥柱，欧洲战争的残酷教训犹在眼前。"
 USA_Expand_presidential_office:0 "扩大总统办公室职能"
 USA_Expand_presidential_office_desc:0 "不管怎么说，联邦共和国政府在前几任内阁的任期中被摧残地混乱不堪，行政效率低下，官员贪污腐败严重，这都是因为过于放权和管控不当，导致了行政体系瘫痪。"
 USA_Democratic_politics:0 "民主政治"
 USA_Democratic_politics_desc:0 "独立宣言曾写，人人生而平等。美利坚自古以来就是平等与多民族共生之地，任何一个民族或武装力量都不可凌驾于民主宪法和议会制之上，宪政民主不容动摇。"
 USA_Stabilize_federal_army:0 "稳定联邦国防军"
 USA_Stabilize_federal_army_desc:0 "【待补】联邦国防军的整编与稳定工作，此处文案尚未提供。"
 USA_Curb_oligarchs:0 "遏制寡头与投机者"
 USA_Curb_oligarchs_desc:0 "十年前的大萧条告诉我们，自由市场的自主调节能力纯属无稽之谈，如果没有一个强大的政府进行宏观调控和物价调整，那么整个社会都会陷入各种危机。"
 USA_Integrate_western_troops:0 "整合西部部队"
 USA_Integrate_western_troops_desc:0 "爱达荷的民兵和其余武装力量现已全部归于联邦政府，我们会将其进行二次改编和训练，以适应新世纪的现代化战争。"
 USA_Military_police:0 "宪兵队"
 USA_Military_police_desc:0 "俗话说，没有纪律不成方圆，一支军队更是如此，根据柯立芝总统在国会上宣布的军事改革议案的“联邦民主解放军”进程，将宪兵队和军事法庭进一步正规化。"
 USA_Strengthen_FBI:0 "强化联邦安全局"
 USA_Strengthen_FBI_desc:0 "美利坚联邦安全局（FBI）是联邦的重要内务部执行力量，主要负责反间谍和打击重大犯罪事件活动，保护国家边境并维护安全稳定的国有武装力量，其下设多个职能处室。"
 USA_Gloomy_federal_order:0 "沉闷的联邦秩序"
 USA_Gloomy_federal_order_desc:0 "【待补】高度管控之下形成的沉闷社会秩序，此处文案尚未提供。"
 USA_Prevent_power_solidification:0 "防止权力固化"
 USA_Prevent_power_solidification_desc:0 "很长一段时间以来，某一政党长期把控参众两院多数席位的情况日益严重，选区划分严重偏向单一党派，少数群体的代表权被持续挤压，传统的两党制度正在失去平衡。"
 USA_Rewrite_constitution:0 "重订合众宪法"
 USA_Rewrite_constitution_desc:0 "美国规定了总统大选制和参众议院制度作为美国民主的根基，三权分立是美国不同于欧洲独裁帝国的部分，也是民主进步主义的一大特色。而第二修正案亦需重新审视。"
 USA_New_raider_guerrillas:0 "新掠夺者游击队"
 USA_New_raider_guerrillas_desc:0 "提到北方的最强军队，既不是战功赫赫的步兵大红一师，也不是被称作第一队伍的美国第一骑兵师，而是常年驻扎在华盛顿特区南部军区的一支“民兵”武装。"
 USA_Promote_backbone_generals:0 "提拔骨干将领"
 USA_Promote_backbone_generals_desc:0 "随着西点军校的扩招计划，军官团中也是时候来一场晋升大会了，不仅是为了表达对老兵的敬意与祝福，也是新生血液的一场欢迎仪式。"
 USA_America_endures:0 "美利坚永存"
 USA_America_endures_desc:0 "扫清政敌反对派和极端主义威胁后，我们将继续加强对国内的战争宣传与统一思想，美利坚一山不容二虎，而民主才能让合众国再放光芒，我们是世界的灯塔。"
 USA_National_unity:0 "民族团结"
 USA_National_unity_desc:0 "我们都是美利坚人，我们不惧任何挑战和困难，我们的祖辈团结在一起击溃了不列颠和西班牙，十三州联合将会再次成为现实，正如革命先烈华盛顿所愿。"
 USA_Mellon_tax_cut:0 "梅隆减税法案落地"
 USA_Mellon_tax_cut_desc:0 "美国财政部长安德鲁·梅隆主导的一系列大幅减税法案，核心是降低高收入人群所得税率，以刺激投资和经济增长。主要针对个人所得税提出了附加条款。"
 USA_Permanent_readiness:0 "永久战备计划"
 USA_Permanent_readiness_desc:0 "为了保证国土安全与社会稳定，我们将联合五角大楼、联邦安全局、财政部、粮食资源部和教育部进行国家永久战备计划，边境的冲突随时会爆发，南方的威胁从未消退。"
 USA_Washington_speech:0 "华盛顿国民演讲"
 USA_Washington_speech_desc:0 "完成这一切准备工作后，柯立芝总统将会前往华盛顿特区进行最大规模的演讲……"

 
