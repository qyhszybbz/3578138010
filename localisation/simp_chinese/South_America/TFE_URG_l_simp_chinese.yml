        URG_Carlos_Domingo_Marx:0 "卡洛斯·多明戈·马克斯"
        URG_Carlos_Domingo_Marx_desc:0 "作为阿古斯丁·胡斯托的亲传弟子，马克斯也像他师傅一样长袖善舞，两面逢源，为此他也在阿根廷混得风生水起。\n\n但是随着经济危机开始显现，激进公民联盟的威望大跌，胡斯托开始联合国家民主党试图威胁政权，于是激进公民联盟一转对军队胡斯托派的宽松态度，卡洛斯·马克斯作为羽翼便是最早被赶走的那一批。\n\n乌拉圭地区局势复杂，抗议不断，相较于巴拉圭有过之而无不及，至少布宜诺斯艾利斯会认为这是一个好职位，但是如果胡斯托成功推翻了激进公民联盟，情况恐怕有所不同。"
        URG_caudillo_of_uruguay:0 "乌拉圭的考迪罗"

        URG_red_and_white:0 "红与白"
        URG_red_and_white_desc:0 "§R除非我们撤军，不然这两个问题将会彻底撕裂乌拉圭§!\n\n红党与白党——乌拉圭两个最主要的政党，是长期撕裂乌拉圭的罪魁祸首，早在三国同盟战争时期，他们的内战便导致了我们下场摧毁了巴拉圭。然而这并未使他们消停下来。\n\n1925年，白党内的保守派路易斯·阿尔贝托·德埃雷拉·克维多控制了政府，随后当选总统，他强烈呼吁乌拉圭参加查科战争，这引起了布宜诺斯艾利斯的警惕，最终在一次边境冲突中，阿根延的陆军摧毁了巴拉圭和乌拉圭，这引起了极大争议，一些国家谴责阿根廷蓄意挑起侵略战争。\n\n战后阿根廷建立了军政府，但这显然不足以服众——红党宣称应该将政府交还或重新举行选举，白党虽被封禁仍在暗中破坏，乌拉圭的局势显然难以维持。"
