 BTG: "巴塔哥尼亚王国"
 BTG_DEF: "巴塔哥尼亚王国"

 BTG_Regency_Council: "摄政委员会"
 BTG_Regency_Council_desc: "按照1902年《王国法》阿根廷有权管理巴塔哥尼亚地区，巴塔哥尼亚王国属于阿根廷王国的一部分，但王室属于独立地位，这一地位显然令寻求独立的马普切人大为不满，他们不再对巴塔哥尼亚王室提供支持。\n\n1917年，安托万三世登基后神秘去世，阿根廷王国命令成立摄政委员会，暂时总揽权力。但是关于推举新的国王，各方没有定论，一些人认为应该让萨伏伊王朝登基，另一些人支持图龙家族的其他人，另一些人支持马普切贵族。这一局势持续至今仍在僵持。"
 BTG_Authoritarianism_party: "摄政委员会"
