 TIB_Panchen_Chokyi_Nyima: "九世班禅额尔德尼"

 TIB_Thousand_years_of_feudal_serfdom: "千年的封建农奴制"
 TIB_Thousand_years_of_feudal_serfdom_desc: "雪域的贵族，从始至终依靠农奴的耕种来积攒财富，这一制度已经延续千年，自始至终是我们政府的底部支撑，噶厦政府、各大库扎维系的命脉，这一地位在第十饶迥土马年的《十六法典》得到彻底强化。\n\n虽然来自西方、北京政府的人士常常批判描绘这一雪域高原的非人道行为，但这制度已经存续了太长太长的时间，§R除非一场天崩地裂的革命，将旧秩序倾覆。§!"
 TIB_Predicament_of_Ninth_Panchen: "九世班禅的困局"
 TIB_Predicament_of_Ninth_Panchen_desc: "     §c业果若不定，便成无因果；\n     业果若决定，众生不成佛。\n     当知业可转，如二水相投：\n     热多冷从热，冷多热从冷。\n          ——《宗喀巴显密次第科颂》§!\n民国4年，即藏历第十五饶迥木兔年，扎升伦布寺与甘丹颇章初起裂痕，第十三世达赖喇嘛设立基宗对后藏长期的地位形成威胁。随后在第十五饶迥水猪年，即民国12年，第九世班禅额尔德尼最终因害怕进一步迫害选择出走内地。但在13世达赖喇嘛坐化后，遵循其遗嘱，在北京政府的关照之下，班禅重返拉萨担任摄政。\n\n尽管如此，在水鸡年达赖坐化的数年后，政治混乱一直侵袭着藏地，以十三世亲信为首的包括助理司伦土登贡培等人的势力以及以热振活佛和达扎活佛还有藏官等等诸派系的围堵，以及九世班禅自身身体的状况恶化，这场困局仍然像一团乱麻一样。"
 TIB_Internal_troubles_and_external_threats: "内忧外患"
 TIB_Internal_troubles_and_external_threats_desc: "§R各地将会掀起一轮又一轮叛乱§!\n\n民国元年，在长期的川藏斗争中，甘丹颇章取得了最终的胜利，川军大部退出昌都地区，我们重新获取了对该地区的控制。\n\n然而，随着英属印度的崩溃，藏军外来援助已陷入枯竭，随着北京形式风云变幻，波密土王、玉树诸千户的蠢蠢欲动，回回和西藏的觊觎，甘丹颇章的危机还在不停的继续。"
 TIB_Interactions_with_South: "与南方的交往"
 TIB_Interactions_with_South_desc: "长期以来，甘丹颇章和南方的英国人颇有交织，依靠英国人体系，藏军实现了部分的现代化，我们也可以从此走向世界的外面。\n\n然而除此之外，英国人还是我们抵御北京政府大规模渗透的屏障，然而随着英属印度的崩溃，虽然我们重新掌控了达旺地区和哲孟雄，然而这一激进的举动也许会导致我们在两边的不讨好…"
