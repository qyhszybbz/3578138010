 POR_antonio_de_oliveira_salazar: "安东尼奥·萨拉查"
 POR_antonio_de_oliveira_salazar_desc: "§Y政府首脑兼财政部长§!"
 POR_antonio_de_oliveira_salazar_sl_desc: "\n\n\n§Y安东尼奥·萨拉查§!\n\n\n\n\n\n\n\£GFX_leader_POR_Antonio_Salazar\n\n\n\n\n\n\n\n\n-------------\n§Y生于:§!§L1889年,葡萄牙利塞乌省§!\n§L萨拉查出生于葡萄牙一个资产阶级客栈主家庭，作为天主教徒的他早年学习神学，后来前往科英布拉大学就读法律系，毕业后在这所大学担任政治经济学教授。萨拉查很早就被视为天主教极右派利益的理想代表及君主制的同情者。当葡萄牙王国复辟后，他被国王任命为财政部长，他用几年功夫将葡萄牙的账目理得清清楚楚，在他逐渐掌握了国家财政大权后，葡萄牙的经济也有起色。伦敦股市大萧条后，萨拉查实行了多项改革，以应对财政危机，通过镇压葡共及共和主义者，他在葡萄牙的地位几乎无人可撼动。在邻国西班牙发生内战后，在萨拉查的建议下，葡萄牙承认了西班牙国政权并接收了流亡的西班牙国王及王室成员。§!"
