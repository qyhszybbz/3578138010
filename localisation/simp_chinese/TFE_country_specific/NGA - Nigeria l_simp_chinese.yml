 NGA_Fractured_Territory: "断裂的国土"
 NGA_Fractured_Territory_desc: "一战英属非洲殖民体系的崩溃不仅夺走了帝国的保护伞，也撕裂了尼日利亚本身。法国军队从达荷美和法属西非南下，占领了北方大片土地，将曾经统一的殖民地从卡诺到索科托一并吞入法属西非。如今尼日尔河以北的豪萨-富拉尼地区已沦为法国殖民地，南岸联邦只控制着约鲁巴、伊博和三角洲地区。北方同胞被隔绝在法语行政体系之下，而我国的民族主义者却无力北顾，只能隔河而望。"
 NGA_ThreePort_Dispute_Lagos: "三港之争-拉各斯霸权"
 NGA_ThreePort_Dispute_Lagos_desc: "拉各斯的律师、报人和市政精英已经压过卡拉巴尔与三角洲港口一头。他们掌握着联邦议会、报纸、法院和海关文书，把民族民主党建成了自己的政治机器；卡拉巴尔与三角洲群的商业寡头们目前难以挑战拉各斯作为联邦行政与舆论中心的地位。三港矛盾并未消失，只是暂时被拉各斯的政治优势压制。"

