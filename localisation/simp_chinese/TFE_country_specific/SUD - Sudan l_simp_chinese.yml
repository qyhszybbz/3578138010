 SUD_Ansar_Sect_Network: "安萨教派网络"
 SUD_Ansar_Sect_Network_desc: "从科尔多凡到达尔富尔，安萨教派的谢赫与伊玛目构成了马赫迪国的实际统治骨架。他们不领薪俸，却比任何官僚体系都更忠诚；他们不写报告，却能在斋月讲道中动员数万信徒。阿卜杜拉赫曼深知，控制教派就等于控制国家。"
 SUD_Olive_Branch_from_Paris: "巴黎的橄榄枝"
 SUD_Olive_Branch_from_Paris_desc: "1898年，法国远征队曾在法绍达插上三色旗，试图从西非横穿至尼罗河，切断英国“开罗—开普敦”的南北轴线。 虽然那次冒险最终在伦敦的压力下撤退，但巴黎从未真正放弃尼罗河谷。如今英国在非洲的殖民体系崩溃，法国商人、军官和传教士重新出现在苏丹边境，带着勒贝尔步枪、信贷合同和“反英友谊”的承诺。"
 