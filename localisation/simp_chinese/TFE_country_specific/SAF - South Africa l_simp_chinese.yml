 SAF_Welfare_State_in_Africa: "非洲福利之邦"
 SAF_Welfare_State_in_Africa_desc: "统工党的雏形是大萧条期间的工党-南非党联合政府，这也是工党的首次掌权，而之后合并而成的统工党延续了其在大萧条期间的治理方针，通过渐进的改革捍卫白人劳工的权利不受侵犯，调和劳资关系稳定生产，并且在全国建立了数额庞大的公共设施服务。毫无疑问，南非是阿非利加大陆的福利之国。"
 SAF_Party_with_Facade_of_Peace: "同床异梦的党"
 SAF_Party_with_Facade_of_Peace_desc: "统工党是为抵抗布尔激进派与缓和白人矛盾而由南非党与工党合并的产物。离奇的是，代表矿业资本利益的南非党与代表白人工人利益的工党，竟在同一个党旗下握手言和。然而这场政治婚姻从一开始就充满了裂痕。\n\n旧工党派系内部，以梅德利为首的全国委员会派仍抱持跨种族工会团结的旧日理想，主张福利应向有色人乃至黑人劳工延伸；克雷斯韦尔派则死守“文明劳工”信条，视任何让步为对白人劳工的背叛。两派在内阁中针锋相对，貌合神离。而旧南非党议员则冷眼旁观——他们只关心矿业利润与帝国联系，只要布尔激进派被挡在门外，便心满意足。"
 SAF_House_Divided: "分裂之家"
 SAF_House_Divided_desc: "白人内部并不团结，英裔与布尔人的冲突就一直接连不断，从一战战败布尔人就对英国政府充满失望，而到了统工党执政时期，又对于种族问题的怀柔态度，所主张的类“经济种族主义”都无时无刻刺痛着布尔人的神经。终有一天，布尔人将会从英格兰人的手底下再次掌握自己的命运，建立属于自己的家园。"