 BOT_Shadow_of_Cape_desc: "南非联邦从未掩饰对北方的野心。“白人带”构想将贝专纳兰视为南非联邦自然延伸的一部分——从开普到赤道，每一寸高原都应是白人文明的疆域。一战后英国势力退潮，南非联邦的军队、铁路公司和农场主沿着林波波河向北推进，关税、土地收购和警察巡逻步步紧逼，仿佛吞并只是时间问题。"
