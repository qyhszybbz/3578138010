 AMD_solomon_guggenheim: "所罗门·R·古根海姆"
 AMD_solomon_guggenheim_desc: "§Y生于:§!§L1861年2月2日,美利坚合众国宾夕法尼亚州费城§!\n§L古根海姆家族的产业横跨两个美国、加拿大以及秘鲁玻利维亚。作为家族的四子，所罗门被派往阿塔卡马，打理当地产业。\n\n早年间阿塔卡马的当地产业混乱不堪，多家企业互相倾轧，然而古根海姆将这一切都镇压了下去——不光彩的手段、肮脏的交易、见不得光的生意，一切都被摆平了。\n\n明面上，古根海姆是一位乐善好施的人，也是一位热心的收藏家和艺术鉴赏家。不过他如今遇到了最大的阻碍：布什成为了秘鲁玻利维亚总统。§!"
 AMD_mining_magnate: "矿业巨鳄"

 AMD_bunker_forest: "碉堡之林"
 AMD_bunker_forest_desc: "因为太平洋战争的惨胜，我们在阿塔卡马建立了大量的碉堡用于防御智利佬的偷袭。尽管今日大部分碉堡早已残破，但若是加以修缮，亦可以抵御智利的入侵。"